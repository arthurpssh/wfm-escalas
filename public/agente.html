<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha escala · Gestão de escalas</title>
  <link rel="stylesheet" href="https://static.hotmart.com/fonts/v1/css/hotmart-sans.min.css">
  <link rel="stylesheet" href="https://static.hotmart.com/fonts/v1/css/hotmart-display.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/minha-escala"><img class="brand-logo" src="/img/hotmart-logo-color-negative.png" alt="Hotmart"><span class="brand-title">Gestão de escalas</span></a>
    <nav id="nav" class="nav"></nav>
    <div class="spacer"></div>
    <label class="mock-login" title="Somente no mock: em produção a identidade vem do cabeçalho do sistema que hospeda o app">entrar como <select id="mockUser"></select></label>
  </header>

  <div class="toolbar">
    <strong id="teamLabel" class="team-label"></strong>
    <div class="month-picker">
      <button id="prevMonth" title="Mês anterior" aria-label="Mês anterior"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <input type="month" id="monthInput">
      <button id="nextMonth" title="Próximo mês" aria-label="Próximo mês"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <input type="search" id="filter" placeholder="Buscar colega…">
    <div class="legend">
      <span><i class="sw ok"></i>Escalado</span>
      <span><i class="sw partial"></i>Folga parcial</span>
      <span><i class="sw full"></i>Folga total</span>
      <span><i class="sw vac"></i>Férias</span>
      <span><i class="sw extra"></i>Dia extra (+)</span>
    </div>
  </div>
  <div id="banner" class="banner hidden"></div>

  <main>
    <div class="pager">
      <button id="weekPrev"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Semana anterior</span></button>
      <button id="weekNext"><span>Próxima semana</span><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      <span class="hint">Clique em um dia para ver os horários e as atividades. Só leitura.</span>
    </div>
    <div class="table-wrap" id="tableWrap"></div>

    <section class="panel-card" style="margin-top:24px">
      <div class="form-inline" style="margin:0 0 12px; align-items:center"><h3 style="margin:0">Minhas folgas</h3><button id="askBtn" class="primary">Pedir folga</button></div>
      <div id="own"></div>
    </section>

    <section class="panel-card">
      <h3>Minhas trocas de dia extra</h3>
      <div id="swaps"></div>
    </section>
  </main>

  <aside id="panel" class="panel hidden" aria-label="Detalhes do dia"></aside>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/agente.js"></script>
</body>
</html>
